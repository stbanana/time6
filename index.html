<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>28h 时钟 · time6</title>
  <meta name="description" content="一天 28 小时、一周 6 天的时钟：以 28 小时制显示现在的时间，并给出每天的推荐入睡时间与倒计时。">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#070b16">
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script>
    // 首屏前定主题，避免闪白；默认深色（可切换并记住）。
    (function () {
      try {
        var saved = localStorage.getItem('time6:theme');
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      } catch (e) { /* file:// 或隐私模式下忽略 */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <rect width="64" height="64" rx="16" fill="#0d1526"></rect>
        <circle cx="32" cy="32" r="18" fill="none" stroke="#26314d" stroke-width="6"></circle>
        <path d="M32 14 A18 18 0 0 1 49.55 36" fill="none" stroke="#8ea2ff" stroke-width="6" stroke-linecap="round"></path>
        <path d="M49.55 36 A18 18 0 1 1 32 14" fill="none" stroke="#ffb454" stroke-width="6" stroke-linecap="round"></path>
        <circle cx="32" cy="14" r="3.4" fill="#ffb454"></circle>
      </svg>
      <span class="brand-name">time6</span>
      <span class="brand-sub">一天 28 小时 · 一周 6 天</span>
    </div>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="切换到浅色主题">
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"></path>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>
      </svg>
    </button>
  </header>

  <main id="main">
    <section class="clock-card card" aria-labelledby="clockTitle">
      <h1 class="sr-only" id="clockTitle">28 小时制时钟</h1>

      <div class="watch">
        <svg class="dial" viewBox="0 0 400 400" role="img" aria-labelledby="dialTitle dialDesc">
          <title id="dialTitle">28 小时表盘</title>
          <desc id="dialDesc">表盘一圈为 28 小时；指针指示当前的 28 小时制时间，紫色刻度标记每天的推荐入睡时间。</desc>
          <circle class="dial-rim" cx="200" cy="200" r="160"></circle>
          <g class="dial-ticks" id="dialTicks" aria-hidden="true"></g>
          <circle class="dial-track" cx="200" cy="200" r="128"></circle>
          <g class="dial-numerals" id="dialNumerals" aria-hidden="true"></g>
          <g class="dial-bedtime" id="dialBedtime" aria-hidden="true"></g>
          <path class="dial-progress" id="dialProgress" d=""></path>
          <path class="dial-overdue" id="dialOverdue" d=""></path>
          <g class="dial-hand" id="dialHand" aria-hidden="true">
            <line x1="200" y1="92" x2="200" y2="50"></line>
            <circle cx="200" cy="72" r="5.2"></circle>
          </g>
        </svg>

        <div class="face">
          <p class="face-day" id="faceDay">— · 第 — / 6 天</p>
          <p class="face-time">
            <span class="sr-only" id="srClock">正在读取时间</span>
            <span id="clockTime" aria-hidden="true">--:--</span>
          </p>
          <p class="face-zone">28 小时制</p>
        </div>
      </div>

      <div class="sleep-panel">
        <div class="sleep-block">
          <p class="block-label"><span class="mark-sleep" aria-hidden="true"></span>推荐入睡</p>
          <p class="block-value" id="bedtime">20:00</p>
        </div>
        <div class="sleep-block count-block" id="countBlock">
          <p class="block-label" id="countLabel">距推荐入睡</p>
          <p class="block-value" id="countValue">—</p>
        </div>
      </div>
    </section>

    <footer class="foot">
      <p>28h 世界 · 00:00 起算 · 推荐入睡 20:00</p>
      <p class="foot-meta">
        <span id="tzLabel">本地时区</span>
        <span aria-hidden="true">·</span>
        <span>只做时间换算，不构成健康建议</span>
      </p>
    </footer>

    <p class="sr-only" id="liveStatus" aria-live="polite" aria-atomic="true"></p>
  </main>

  <noscript>
    <p class="fatal">这个页面需要 JavaScript 才能计算 28 小时时间，请在浏览器中启用后刷新。</p>
  </noscript>

  <script src="./assets/js/schedule.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
